name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # tests/test_packaging.py builds a real wheel to assert what the
          # install actually puts on sys.path. pip's build isolation does not
          # leave a build backend in the environment, so setuptools/wheel are
          # declared explicitly as test dependencies.
          python -m pip install pytest setuptools wheel

      - name: Run test suite
        # Deliberately the `pytest` console script, not `python -m pytest`.
        # The `-m` form implicitly prepends the cwd to sys.path, which masked
        # the no-op conftest guard (#12): the suite imported even though
        # nothing in the repo put the package on the path. The console script
        # exercises tests/conftest.py the way a contributor's terminal does.
        run: pytest tests/ -v
